<h1>Codex Island</h1><p>像素灵动岛：主对话、用量、进度、未查看结果和轻像素提示音。</p>
<ul><li>支持 macOS 13+，Apple Silicon 和 Intel Mac。</li><li>需要 Codex/ChatGPT 桌面应用及 Apple Command Line Tools 提供的 Python 3。没有后者时先运行 <code>xcode-select --install</code>。</li><li>安装应用及 Agent 指南，并为当前登录用户配置本地插件和登录服务。</li><li>首次插件 hooks 信任需在 Codex 中确认。本包不包含作者的聊天或账户数据。</li></ul>
